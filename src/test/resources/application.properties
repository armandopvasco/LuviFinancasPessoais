# O esquema legado anterior ao Flyway não está no repositório.
# Os testes sobem o banco a partir das entidades e das migrations já refletidas nelas.
spring.datasource.url=${LUVI_DB_URL:jdbc:postgresql://localhost:5432/luvi_financas_test}
spring.datasource.username=${LUVI_DB_USERNAME:luvi}
spring.datasource.password=${LUVI_DB_PASSWORD:luvi}
spring.jpa.hibernate.ddl-auto=${LUVI_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.flyway.enabled=${LUVI_FLYWAY_ENABLED:false}
