<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luvi Finanças - Login</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="logo">L</div>
        <h1>Luvi Finanças</h1>
        <p class="subtitle">Controle financeiro da família</p>

        <div class="message success" th:if="${param.logout}">
            Você saiu da aplicação.
        </div>

        <div class="message error" th:if="${param.error}">
            Usuário ou senha inválidos.
        </div>

        <form method="post" action="/login">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>

            <label for="username">Usuário</label>
            <input id="username"
                   type="text"
                   name="username"
                   autocomplete="username"
                   required>

            <label for="password">Senha</label>
            <input id="password"
                   type="password"
                   name="password"
                   autocomplete="current-password"
                   required>

            <button type="submit">Entrar</button>
        </form>

        <p class="hint">
            O mesmo acesso pode ser usado por você e sua esposa.
        </p>
    </div>
</div>
</body>
</html>
