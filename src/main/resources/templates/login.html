<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luvi - Login</title><link rel="stylesheet" href="/css/login.css"></head><body><div class="login-container"><div class="login-card"><div class="logo">L</div><h1>Luvi Finanças</h1><p class="subtitle">Suas finanças, sozinho ou em família.</p><div class="message success" th:if="${param.logout}">Você saiu da aplicação.</div><div class="message success" th:if="${param.cadastro}">Cadastro realizado. Entre com seu e-mail e senha.</div><div class="message error" th:if="${param.error}">Usuário/e-mail ou senha inválidos.</div><form method="post" action="/login"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label for="username">Usuário ou e-mail</label><input id="username" name="username" required autocomplete="username"><label for="password">Senha</label><input id="password" type="password" name="password" required autocomplete="current-password"><button type="submit">Entrar</button></form><p class="hint">Ainda não usa o Luvi? <a href="/cadastro">Criar minha conta</a></p></div></div></body></html>
