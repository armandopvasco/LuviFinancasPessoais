<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luvi - Cadastro</title><link rel="stylesheet" href="/css/login.css"></head><body><div class="login-container"><div class="login-card"><div class="logo">L</div><h1>Criar conta</h1><p class="subtitle">Comece seu controle financeiro.</p><div class="message error" th:if="${erro}" th:text="${erro}"></div><form method="post" action="/cadastro"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Nome</label><input name="nome" th:value="${nome}" required maxlength="120"><label>E-mail</label><input name="email" type="email" th:value="${email}" required><label>Senha</label><input name="senha" type="password" minlength="6" required><label>Confirmar senha</label><input name="confirmarSenha" type="password" minlength="6" required><button type="submit">Criar cadastro</button></form><p class="hint"><a href="/login">Voltar ao login</a></p></div></div></body></html>
