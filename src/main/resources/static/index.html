<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luvi Finanças Pessoais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div>
        <h1>Luvi Finanças</h1>
        <p>Controle financeiro pessoal</p>
    </div>
</header>

<main>
    <section class="filtros">
        <button id="mesAnterior">←</button>
        <h2 id="mesAtual"></h2>
        <button id="mesProximo">→</button>
    </section>

    <section class="resumo">
        <div class="card receita">
            <span>Receitas</span>
            <strong id="totalReceitas">R$ 0,00</strong>
        </div>
        <div class="card despesa">
            <span>Despesas</span>
            <strong id="totalDespesas">R$ 0,00</strong>
        </div>
        <div class="card saldo">
            <span>Saldo</span>
            <strong id="saldo">R$ 0,00</strong>
        </div>
    </section>

    <section class="acoes">
        <button id="novoLancamento" class="btn-principal">+ Novo lançamento</button>
    </section>

    <section class="tabela-container">
        <table>
            <thead>
            <tr>
                <th>Data</th>
                <th>Descrição</th>
                <th>Categoria</th>
                <th>Tipo</th>
                <th>Valor</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="tabelaLancamentos"></tbody>
        </table>
        <p id="semLancamentos" class="sem-lancamentos">Nenhum lançamento neste mês.</p>
    </section>
</main>

<div id="modal" class="modal escondido">
    <div class="modal-conteudo">
        <div class="modal-cabecalho">
            <h2 id="tituloModal">Novo lançamento</h2>
            <button id="fecharModal" class="fechar">×</button>
        </div>

        <form id="formLancamento">
            <input type="hidden" id="id">

            <label>Tipo</label>
            <select id="tipo" required>
                <option value="DESPESA">Despesa</option>
                <option value="RECEITA">Receita</option>
            </select>

            <label>Descrição</label>
            <input type="text" id="descricao" maxlength="200" required>

            <label>Categoria</label>
            <select id="categoria" required>
                <option value="ALIMENTACAO">Alimentação</option>
                <option value="MORADIA">Moradia</option>
                <option value="TRANSPORTE">Transporte</option>
                <option value="SAUDE">Saúde</option>
                <option value="EDUCACAO">Educação</option>
                <option value="LAZER">Lazer</option>
                <option value="CONTAS">Contas</option>
                <option value="SALARIO">Salário</option>
                <option value="RENDA_EXTRA">Renda extra</option>
                <option value="OUTROS">Outros</option>
            </select>

            <label>Valor</label>
            <input type="number" id="valor" step="0.01" min="0.01" required>

            <label>Data</label>
            <input type="date" id="data" required>

            <div class="form-acoes">
                <button type="button" id="cancelar" class="btn-secundario">Cancelar</button>
                <button type="submit" class="btn-principal">Salvar</button>
            </div>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
