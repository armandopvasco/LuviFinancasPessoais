<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luvi Finanças Pessoais</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
    <div>
        <h1>Luvi Finanças</h1>
        <span>Controle financeiro da família</span>
    </div>
    <form method="post" action="/logout">
        <button class="logout-button" type="submit">Sair</button>
    </form>
</header>

<main class="container">
    <section class="month-navigation">
        <button id="mesAnterior" class="secondary-button">‹</button>
        <h2 id="mesAtual"></h2>
        <button id="mesProximo" class="secondary-button">›</button>
    </section>

    <section class="summary-grid">
        <div class="summary-card receita">
            <span>Receitas</span>
            <strong id="totalReceitas">R$ 0,00</strong>
        </div>
        <div class="summary-card despesa">
            <span>Despesas</span>
            <strong id="totalDespesas">R$ 0,00</strong>
        </div>
        <div class="summary-card saldo">
            <span>Saldo</span>
            <strong id="saldo">R$ 0,00</strong>
        </div>
    </section>

    <section class="actions">
        <button id="novoLancamento" class="primary-button">+ Novo lançamento</button>
    </section>

    <section class="table-card">
        <div class="table-header">
            <h2>Lançamentos</h2>
        </div>

        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>Data</th>
                    <th>Tipo</th>
                    <th>Descrição</th>
                    <th>Categoria</th>
                    <th>Valor</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody id="lancamentosBody"></tbody>
            </table>
        </div>

        <div id="semLancamentos" class="empty-state">
            Nenhum lançamento neste mês.
        </div>
    </section>
</main>

<div id="modal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitulo">Novo lançamento</h2>
            <button id="fecharModal" class="close-button">&times;</button>
        </div>

        <form id="lancamentoForm">
            <input type="hidden" id="lancamentoId">

            <label for="tipo">Tipo</label>
            <select id="tipo" required>
                <option value="DESPESA">Despesa</option>
                <option value="RECEITA">Receita</option>
            </select>

            <label for="descricao">Descrição</label>
            <input id="descricao" maxlength="200" required>

            <label for="categoria">Categoria</label>
            <select id="categoria" required></select>

            <label for="valor">Valor</label>
            <input id="valor" type="number" min="0.01" step="0.01" required>

            <label for="data">Data</label>
            <input id="data" type="date" required>

            <div id="formError" class="form-error"></div>

            <div class="modal-actions">
                <button type="button" id="cancelarModal" class="secondary-button">Cancelar</button>
                <button type="submit" class="primary-button">Salvar</button>
            </div>
        </form>
    </div>
</div>

<script src="/js/script.js"></script>
</body>
</html>
