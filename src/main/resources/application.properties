spring.application.name=LuviFinancasPessoais

# ============================================================
# BANCO DE DADOS
# Em produção, configure estas variáveis no serviço de hospedagem.
# ============================================================
spring.datasource.url=${LUVI_DB_URL:jdbc:postgresql://localhost:5432/luvi_financas}
spring.datasource.username=${LUVI_DB_USERNAME:}
spring.datasource.password=${LUVI_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${LUVI_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${LUVI_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

# ============================================================
# AUTENTICAÇÃO
# Um único usuário/senha pode ser compartilhado pelo casal.
# Em produção, NÃO use os valores padrão: configure as variáveis.
# ============================================================
luvi.security.username=${LUVI_APP_USERNAME:familia}
luvi.security.password=${LUVI_APP_PASSWORD:}

# ============================================================
# SERVIDOR
# ============================================================
server.port=${PORT:8080}

# Necessário para o Spring Security reconhecer corretamente
# o esquema HTTPS quando houver proxy reverso na hospedagem.
server.forward-headers-strategy=framework
